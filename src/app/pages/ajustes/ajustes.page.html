<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Ajustes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" color="light">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Ajustes</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="settings-container">
    <ion-list inset="true">
      <ion-list-header>
        <ion-label>Perfil de Usuario</ion-label>
      </ion-list-header>

      <div class="avatar-section ion-padding">
        <ion-avatar (click)="addPhoto()">
          <img [src]="photoService.foto || 'assets/img/logo.png'" />
          <div class="camera-badge">
            <ion-icon name="camera-outline"></ion-icon>
          </div>
        </ion-avatar>
        <p class="avatar-hint">Pulsa para cambiar tu foto</p>
      </div>
      
      <ion-item lines="full">
        <ion-icon slot="start" name="person-outline" color="primary"></ion-icon>
        <ion-input label="Tu Nombre" labelPlacement="stacked" placeholder="Escribe tu nombre" [(ngModel)]="nombreUsuario"></ion-input>
        <ion-button slot="end" fill="clear" (click)="guardarNombre()">
          <ion-icon slot="icon-only" name="save-outline"></ion-icon>
        </ion-button>
      </ion-item>
    </ion-list>

    <ion-list inset="true">
      <ion-list-header>
        <ion-label>Apariencia</ion-label>
      </ion-list-header>
      
      <ion-item lines="full">
        <ion-icon slot="start" name="moon-outline" color="secondary"></ion-icon>
        <ion-label>Modo Oscuro</ion-label>
        <ion-toggle slot="end" [(ngModel)]="modoOscuro" (ionChange)="cambiarModoOscuro()"></ion-toggle>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
