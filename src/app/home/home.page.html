<app-header></app-header>

<ion-content color="light">
  <div class="welcome-container ion-padding-horizontal ion-margin-top">
    <div class="welcome-text">
      <h2>¡Hola, <span>{{ nombreUsuario || 'Visitante' }}</span>!</h2>
      <p>Bienvenido a Tacita Guía</p>
    </div>
  </div>
  
  <div class="ion-padding-horizontal">
    <ion-searchbar placeholder="Buscar monumentos..." [debounce]="500" (ionInput)="search($event)"></ion-searchbar>
  </div>

  <ion-list>
    <ion-item>
      <ion-input label="Nuevo Monumento" labelPlacement="floating" placeholder="Nombre del monumento"
        [(ngModel)]="nuevo_monumento.nombre">
      </ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Descripcion" labelPlacement="floating" placeholder="Descripcion del monumento"
        [(ngModel)]="nuevo_monumento.descripcion">
      </ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Imagen" labelPlacement="floating" placeholder="Imagen del monumento"
        [(ngModel)]="nuevo_monumento.imagen">
      </ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Ubicacion" labelPlacement="floating" placeholder="Ubicacion del monumento"
        [(ngModel)]="nuevo_monumento.ubicacion">
      </ion-input>
    </ion-item>
    <ion-item>
      <ion-label>Fecha de Construcción</ion-label>
      <ion-datetime-button datetime="datetime"></ion-datetime-button>
    </ion-item>
    <ion-modal [keepContentsMounted]="true">
      <ng-template>
        <ion-datetime id="datetime" presentation="date"></ion-datetime>
      </ng-template>
    </ion-modal>

    <ion-button expand="block" class="ion-margin-top ion-margin-bottom" (click)="onAddClick()">
      Añadir Monumento
    </ion-button>
    <ion-alert [isOpen]="isAlertOpen" header="Confirmar" message="¿Estás seguro de añadir este monumento?" [buttons]="alertButtons" (didDismiss)="isAlertOpen=false"></ion-alert>

  </ion-list>

  <ion-grid #profileCard>
    <ion-row class="ion-justify-content-center ion-align-items-start">
      <ng-container *ngIf="cargando">
        <ion-col size="6" size-sm="6" size-md="5" size-lg="4" size-xl="3" class="monument-col"
          *ngFor="let skeleton of skeletonCards">
          <ion-card class="skeleton-card">
            <ion-skeleton-text animated style="width: 100%; height: 200px; margin: 0"></ion-skeleton-text>
            <ion-card-header>
              <ion-skeleton-text animated style="width: 50%; height: 16px; margin-bottom: 5px"></ion-skeleton-text>
              <ion-skeleton-text animated style="width: 80%; height: 24px"></ion-skeleton-text>
            </ion-card-header>
            <ion-card-content>
              <p>
                <ion-skeleton-text animated style="width: 100%"></ion-skeleton-text>
                <ion-skeleton-text animated style="width: 90%"></ion-skeleton-text>
                <ion-skeleton-text animated style="width: 60%"></ion-skeleton-text>
              </p>
              <div class="ion-margin-top">
                <ion-skeleton-text animated style="width: 30%; height: 30px; border-radius: 4px"></ion-skeleton-text>
              </div>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ng-container>

      <ng-container *ngIf="!cargando">
        <ion-col size="6" size-sm="6" size-md="5" size-lg="4" size-xl="3" class="monument-col"
          *ngFor="let a of monumentos">
          <app-monument-item [monumento]="a" (eliminado)="cargar_monumentos()"></app-monument-item>
        </ion-col>
      </ng-container>
    </ion-row>
  </ion-grid>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="abrirModal()">
      <ion-icon name="information-circle-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
